name: CI - backend smoke

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    
    # Run a postgres container for the tests
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_DB: taskly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend deps
        working-directory: ./backend
        run: npm ci

      - name: Create .env for CI
        run: |
          cat > ./backend/.env <<EOF
          JWT_SECRET=testsecretforci
          PORT=4000
          HOST=0.0.0.0
          DATABASE_URL=postgresql://postgres:password@localhost:5432/taskly_test
          EOF

      - name: Initialize Database Schema
        run: |
          # Use the schema.sql from the backend folder to set up the test DB
          psql postgresql://postgres:password@localhost:5432/taskly_test -f backend/schema.sql

      - name: Start backend (background)
        working-directory: ./backend
        run: |
          node src/index.js > server.log 2>&1 &
          # wait for server to come up
          for i in {1..20}; do
            if curl -sS http://localhost:4000/healthz >/dev/null 2>&1; then
              echo "server is up"
              break
            fi
            echo "waiting..."
            sleep 1
          done
        timeout-minutes: 2

      - name: Smoke test - signup & login
        working-directory: ./backend
        run: |
          set -e
          # 1. Signup
          curl -s -X POST http://localhost:4000/api/auth/signup -H "Content-Type: application/json" -d '{"email":"ci_user@example.com","password":"password123"}' -o signup.json
          cat signup.json
          
          # 2. Login
          curl -s -X POST http://localhost:4000/api/auth/login -H "Content-Type: application/json" -d '{"email":"ci_user@example.com","password":"password123"}' -o login.json
          cat login.json
          TOKEN=$(jq -r '.token' login.json)
          
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Login failed"
            exit 1
          fi

          # 3. Create Workspace
          curl -s -X POST http://localhost:4000/api/workspaces -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"name":"CI Workspace"}' -o workspace.json
          cat workspace.json
          WS_ID=$(jq -r '.id' workspace.json)

          # 4. Create a Task
          curl -s -X POST http://localhost:4000/api/tasks -H "Authorization: Bearer $TOKEN" -H "x-workspace-id: $WS_ID" -H "Content-Type: application/json" -d '{"title":"ci task"}' -o task.json
          cat task.json

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: backend/server.log
