services:
  # 1. Backend Web Service
  - type: web
    name: taskly-backend
    env: node
    plan: free
    buildCommand: npm install && cd backend && npm install
    startCommand: cd backend && node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskly-redis
          property: connectionString

  # 2. Redis Service
  - type: redis
    name: taskly-redis
    plan: free
    ipAllowList: [] # Required for internal-only access

# 3. Database Instance
databases:
  - name: taskly-db
    plan: free
