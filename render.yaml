services:
  # 1. Backend Web Service
  - type: web
    name: taskly-backend
    env: node
    plan: free # Change to 'starter' for better performance
    buildCommand: npm install && cd backend && npm install
    startCommand: cd backend && node src/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: taskly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskly-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add your Razorpay & AWS keys in the Render Dashboard manually for security
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

# 2. PostgreSQL Database
databases:
  - name: taskly-db
    plan: free

# 3. Redis Instance
redis:
  - name: taskly-redis
    plan: free
    ipAllowList: [] # Only allow internal Render services
