services:
  # 1. Backend Web Service
  - type: web
    name: taskly-backend
    env: node
    region: ohio # Common stable region
    plan: free
    buildCommand: npm install && cd backend && npm install
    startCommand: cd backend && node src/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskly-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

# 2. Managed PostgreSQL
databases:
  - name: taskly-db
    region: ohio
    plan: free

# 3. Managed Redis
redis:
  - name: taskly-redis
    region: ohio
    plan: free
    ipAllowList: [] # Allows internal access only
